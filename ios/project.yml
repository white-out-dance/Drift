name: Drift
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    DRIFT_BUNDLE_ID: com.example.drift
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Drift:
    type: application
    platform: iOS
    dependencies:
      - target: DriftActivity
    sources:
      - path: Shared
      - path: Drift
        excludes:
          - "idevice/libidevice_ffi.a"
          - "idevice/module.modulemap"
          - "idevice/idevice.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DRIFT_BUNDLE_ID)
        PRODUCT_NAME: Drift
        INFOPLIST_FILE: Drift/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Drift/Support/Drift.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/Drift/idevice"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Drift/idevice"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Drift/idevice"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -lidevice_ffi"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  DriftActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: DriftActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DRIFT_BUNDLE_ID).LiveActivity
        PRODUCT_NAME: DriftActivity
        INFOPLIST_FILE: DriftActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
